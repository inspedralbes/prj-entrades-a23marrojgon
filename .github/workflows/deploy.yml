name: Deploy a Produccion

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar comandos por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            # 1. Entrar en la carpeta o clonar si no existe
            cd /root/tr3 || git clone https://github.com/${{ github.repository }}.git /root/tr3
            cd /root/tr3
            
            # 2. Bajar los cambios nuevos
            git pull origin main
            
            # 3. Encender los contenedores Docker
            docker compose -f docker-compose.prod.yml up --build -d
            
            # 4. Limpiar basura de imágenes viejas
            docker image prune -f