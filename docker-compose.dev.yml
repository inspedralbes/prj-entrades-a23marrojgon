# =============================================================
#  Docker Compose – DESENVOLUPAMENT (Dev)
#  Comanda: docker compose -f docker-compose.dev.yml up --build
# =============================================================

services:
  # -----------------------------------------------------------
  #  Nginx – Punt d'entrada (Reverse Proxy)
  # -----------------------------------------------------------
  webserver:
    image: nginx:1.25-alpine
    container_name: entrades_webserver_dev
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api:/var/www/html:ro
    depends_on:
      - api
      - client
      - socket

  # -----------------------------------------------------------
  #  Backend – Laravel 11 (PHP 8.2)
  # -----------------------------------------------------------
  api:
    build:
      context: ./api
      target: development
    container_name: entrades_api_dev
    restart: unless-stopped
    volumes:
      - ./api:/var/www/html
      - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -----------------------------------------------------------
  #  Frontend – Next.js (React) Dev Server
  # -----------------------------------------------------------
  client:
    build:
      context: ./client
      target: development
    container_name: entrades_client_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: [ "sh", "-c", "npm install && npm run dev" ]
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:8080

  # -----------------------------------------------------------
  #  Socket – Node.js + Socket.io
  # -----------------------------------------------------------
  socket:
    build:
      context: ./socket
      target: development
    container_name: entrades_socket_dev
    restart: unless-stopped
    volumes:
      - ./socket:/app
      - socket_node_modules:/app/node_modules
    command: [ "sh", "-c", "npm install && npx nodemon index.js" ]
    environment:
      - NODE_ENV=development
      - PORT=3001
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy

  # -----------------------------------------------------------
  #  PostgreSQL 15 (Molt millor per alta concurrència)
  # -----------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: entrades_postgres_dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_DATABASE:-entrades}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  #  Redis – Memòria cau i cues
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: entrades_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  #  Eines extres: Adminer i Mailpit
  # -----------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: entrades_mailpit_dev
    ports:
      - "1025:1025"
      - "8025:8025"

  adminer:
    image: adminer:latest
    container_name: entrades_adminer_dev
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DESIGN: 'lucas-theme'
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  client_node_modules:
  socket_node_modules: