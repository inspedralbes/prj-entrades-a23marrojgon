server {
    listen 80;
    server_name _; 
    root /var/www/html/public; # Carpeta public de Laravel

    index index.php index.html index.htm;

    # 1. Frontend Next.js (Principal)
    location / {
        proxy_pass http://client:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Rutas de API Laravel
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 3. Procesar PHP para Laravel (vía FastCGI)
    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 4. WebSockets Node.js (High-Priority)
    location ^~ /socket.io {
        proxy_pass http://socket:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
